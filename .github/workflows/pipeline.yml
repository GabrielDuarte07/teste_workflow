name: primeio workflow de teste

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test_job:
    runs-on: ubuntu-latest

    steps:
    - name: check github variables
      run: |
        echo "path $(pwd)"
        echo "${{github.head_ref}}"
        echo "${{github.ref_name}}"

  test_job_develop:
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download the codebase
        uses: actions/checkout@v6

      - name: send files via FTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{secrets.FTP_HOST_ATLETAS}}
          port: 22
          username: ${{secrets.FTP_USER_ATLETAS}}
          password: ${{secrets.FTP_PWD_ATLETAS}}
          remote_path: /home/novaequipe/www
          sftp_only: true
          rsyncArgs: "--exclude=**/.git* --exclude=**/.git*/** --exclude=.github/** --exclude=readme.md --exclude=.editorconfig"

