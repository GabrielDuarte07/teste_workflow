name: primeio workflow de teste

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main,develop]
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  test_job:
    runs-on: ubuntu-latest

    steps:
    - name: check github variables
      run: |
        echo "path $(pwd)"
        echo "${{github.head_ref}}"
        echo "${{github.ref_name}}"
        echo "${{env.BRANCH_NAME}}"

  test_job_develop:
    if: vars.BRANCH_NAME == 'develop'
    runs-on: ubuntu-latest

    steps:
    - name: test step only develop
      run: |
        ls -la
        whoami

  test_job_main:
    if: github.env.BRANCH_NAME == 'main'
    runs-on: ubuntu-latest

    steps:
    - name: test step only main
      run: |
        echo "branch main: ${{github.ref_name}}"
        echo "teste de arquivo texto" > teste.txt
        echo "segunda linha de teste" >> teste.txt




