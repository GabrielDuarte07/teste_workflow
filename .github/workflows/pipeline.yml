name: primeio workflow de teste

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test_job:
    runs-on: ubuntu-latest

    steps:
    - name: check github variables
      run: |
        echo "path $(pwd)"
        echo "${{github.head_ref}}"
        echo "${{github.ref_name}}"

  test_job_develop:
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download the codebase
        uses: actions/checkout@v4

      - name: send files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{secrets.FTP_HOST_ATLETAS}}
          username: ${{secrets.FTP_USER_ATLETAS}}
          password: ${{secrets.FTP_PWD_ATLETAS}}
          local-dir: ./
          server-dir: ./www/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            readme.md
            .editorconfig

  test_job_main:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
    - name: test step only main
      run: |
        echo "branch main: ${{github.ref_name}}"
        echo "teste de arquivo texto" > teste.txt
        echo "segunda linha de teste" >> teste.txt




