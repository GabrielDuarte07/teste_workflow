name: Deploy workflow

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  development_deploy:
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download the codebase
        uses: actions/checkout@v6


      - name: send files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{secrets.FTP_HOST}}
          username: ${{secrets.FTP_USER}}
          password: ${{secrets.FTP_PWD}}
          server-dir: ./novo/biblioteca/includes/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/
            readme.md
            .editorconfig
            .claude/

      - name: Install php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'

  test_job_main:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
    - name: test step only main
      run: |
        echo "branch main: ${{github.ref_name}}"
        echo "teste de arquivo texto" > teste.txt
        echo "segunda linha de teste" >> teste.txt




